name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DIETWAYS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dietways.jks"
          echo "DIETWAYS_KEYSTORE=$RUNNER_TEMP/dietways.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          DIETWAYS_KEYSTORE_PASSWORD: ${{ secrets.DIETWAYS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../DietWays.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DietWays-apk
          path: DietWays.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DietWays.apk
